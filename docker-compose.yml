# Local development stack: PostgreSQL, Keycloak (OIDC behind Caddy TLS), Mailpit, the API in debug mode and the scanner runner.
# Every service has a memory limit so the whole stack fits comfortably on a 16 GB machine (~4.3 GB in total).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: maven:3.9-eclipse-temurin-25
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: >
      mvn -B -Dmaven.repo.local=/app/.m2/repository spring-boot:run
      -Dspring-boot.run.profiles=dev
      -Dspring-boot.run.jvmArguments="-Xmx640m -XX:+UseSerialGC -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    env_file: .env
    environment:
      HOME: /tmp
      MAVEN_OPTS: -Xmx384m
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KEYCLOAK_ADMIN_API_URL: ${KEYCLOAK_ADMIN_API_URL:-http://keycloak:8080}
    mem_limit: 1536m
    mem_reservation: 768m
    networks:
      - default
      - scanner
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"  # JDWP has no authentication: never expose it beyond this machine
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  keycloak-db-init:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "/init-db.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./keycloak/init-db.sh:/init-db.sh:ro
    mem_limit: 64m
    depends_on:
      db:
        condition: service_healthy

  # Identity provider (OpenID Connect): sign-in, self-registration with e-mail verification, account page.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --hostname=${AUTH_PUBLIC_URL:-https://auth.artemisappsec.localhost:9443}
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
      # Dev only: reload the Artemis theme on every request while editing it.
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60
      # Placeholders used by the realm import
      ARTEMISAPPSEC_WEB_ORIGIN: ${ARTEMISAPPSEC_WEB_ORIGIN:-http://localhost:4200}
      ARTEMISAPPSEC_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:-}
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@artemisappsec.localhost}
    volumes:
      - ./keycloak/realm-artemisappsec.json:/opt/keycloak/data/import/realm-artemisappsec.json:ro
      - ./keycloak/themes/artemis:/opt/keycloak/themes/artemis:ro
    mem_limit: 768m
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  auth-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_PORT:-9443}:9443"
    volumes:
      - ./keycloak/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    mem_limit: 64m
    depends_on:
      - keycloak

  # Development mail catcher: verification and password-reset e-mails appear at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    mem_limit: 64m

  # Runs the open-source scanners (README "Scanner runner"). Sandboxed: read-only root filesystem, no Linux
  # capabilities, in-memory workspace wiped after each run, and no route to the database (scanner network only).
  scanner:
    build: ./scanner
    image: artemisappsec/runner:dev
    restart: unless-stopped
    environment:
      ARTEMIS_API_URL: http://api:8080
      SCANNER_TOKEN: ${SCANNER_TOKEN:-}
      SCANNER_RUN_TIMEOUT_SECONDS: ${SCANNER_RUN_TIMEOUT_SECONDS:-3600}
    read_only: true
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /workspace:rw,size=1g,uid=10001,gid=10001,mode=0700
    volumes:
      - scanner_cache:/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2
    pids_limit: 512
    networks:
      - scanner
    depends_on:
      - api

networks:
  # Shared only by the API and the scanner; the database stays on the default network.
  scanner: {}

volumes:
  db_data:
  caddy_data:
  scanner_cache:
