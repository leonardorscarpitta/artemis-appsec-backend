# Local development stack: PostgreSQL, Authelia (OIDC behind Caddy TLS) and the API in debug mode.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: maven:3.9-eclipse-temurin-25
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: >
      mvn -B -Dmaven.repo.local=/app/.m2/repository spring-boot:run
      -Dspring-boot.run.profiles=dev
      -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    env_file: .env
    environment:
      HOME: /tmp
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  authelia:
    image: authelia/authelia:4.39
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      ARTEMISAPPSEC_AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-artemisappsec.localhost}
      ARTEMISAPPSEC_AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-https://auth.artemisappsec.localhost:9443}
      ARTEMISAPPSEC_WEB_ORIGIN: ${ARTEMISAPPSEC_WEB_ORIGIN:-http://localhost:4200}
      ARTEMISAPPSEC_WEB_REDIRECT_URI: ${ARTEMISAPPSEC_WEB_REDIRECT_URI:-http://localhost:4200/auth/callback}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/secrets:/secrets:ro
      - authelia_data:/data

  auth-proxy:
    image: caddy:2-alpine
    ports:
      - "${AUTH_PORT:-9443}:9443"
    volumes:
      - ./authelia/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - authelia

volumes:
  db_data:
  authelia_data:
  caddy_data:
