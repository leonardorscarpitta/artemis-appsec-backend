# Local development: demo data, verbose logs, no identity provider required.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Seed data uses V1000+, so new schema migrations land "before" it on existing dev databases.
    out-of-order: true
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9091}

logging:
  level:
    io.github.artemiscore.artemis: DEBUG
    org.springframework.web: DEBUG

artemis:
  security:
    auth-enabled: ${AUTH_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
