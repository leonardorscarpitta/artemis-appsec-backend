# Local development: demo data, verbose logs, local Keycloak as identity provider.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Seed data uses V1000+, so new schema migrations land "before" it on existing dev databases.
    out-of-order: true
  jpa:
    show-sql: false

logging:
  level:
    io.github.artemiscore.artemisappsec: DEBUG
    org.springframework.web: DEBUG

artemisappsec:
  security:
    auth-enabled: ${AUTH_ENABLED:true}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:https://auth.artemisappsec.localhost:9443}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://auth-proxy:9080/jwks.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
