spring:
  application:
    name: artemisappsec
  # Background jobs (scheduled scans, sweeps, report generation) must not wait for a slow AI call.
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
  # X-Forwarded-* is honoured only from trusted proxies (Tomcat's default: loopback and private ranges); override
  # with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex) to match the production reverse proxy exactly.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

artemisappsec:
  security:
    auth-enabled: true
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audience: ${OIDC_AUDIENCE:artemisappsec-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  scanner:
    token: ${SCANNER_TOKEN:}
    stage-timeout-seconds: ${SCANNER_STAGE_TIMEOUT_SECONDS:600}
    max-repo-size-mb: ${SCANNER_MAX_REPO_SIZE_MB:500}
    stale-run-minutes: ${SCANNER_STALE_RUN_MINUTES:60}
  deploy-keys:
    encryption-key: ${DEPLOY_KEY_ENCRYPTION_KEY:}
    encryption-key-id: ${DEPLOY_KEY_ENCRYPTION_KEY_ID:v1}
  # User management for platform administrators (Keycloak Admin REST API through a service-account client).
  keycloak-admin:
    url: ${KEYCLOAK_ADMIN_API_URL:}
    realm: ${KEYCLOAK_ADMIN_API_REALM:artemisappsec}
    client-id: ${KEYCLOAK_ADMIN_API_CLIENT_ID:artemisappsec-admin-api}
    client-secret: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:}
  # AI-written report summaries for organizations with the AI feature (Google Gemini API; disabled without a key).
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    gemini-timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    reports-per-day: ${AI_REPORTS_PER_DAY:10}
