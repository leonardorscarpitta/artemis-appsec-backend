spring:
  application:
    name: artemisappsec
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
  # X-Forwarded-* is honoured only from trusted proxies (Tomcat's default: loopback and private ranges); override
  # with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex) to match the production reverse proxy exactly.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

artemisappsec:
  security:
    auth-enabled: true
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audience: ${OIDC_AUDIENCE:artemisappsec-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  billing:
    enabled: ${BILLING_ENABLED:false}
  scanner:
    token: ${SCANNER_TOKEN:}
    stage-timeout-seconds: ${SCANNER_STAGE_TIMEOUT_SECONDS:600}
    max-repo-size-mb: ${SCANNER_MAX_REPO_SIZE_MB:500}
    stale-run-minutes: ${SCANNER_STALE_RUN_MINUTES:60}
  deploy-keys:
    encryption-key: ${DEPLOY_KEY_ENCRYPTION_KEY:}
    encryption-key-id: ${DEPLOY_KEY_ENCRYPTION_KEY_ID:v1}
