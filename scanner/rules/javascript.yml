rules:
  - id: js-eval-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Dynamic code execution with eval/new Function. If any part of the input comes from users,
      this allows arbitrary code execution. Use safe parsing (JSON.parse) or explicit logic instead.
    metadata: { title: Dynamic code execution, cwe: "CWE-95: Eval Injection", artemis-severity: high }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
      - pattern-not: eval("...")

  - id: js-child-process-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Shell command built from variables. An attacker-controlled value can inject extra commands.
      Use execFile/spawn with an argument array and no shell.
    metadata: { title: OS command injection, cwe: "CWE-78: OS Command Injection", artemis-severity: critical }
    pattern-either:
      - pattern: $CP.exec($A + $B, ...)
      - pattern: $CP.execSync($A + $B, ...)
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: exec($A + $B, ...)
      - pattern: execSync(`...${$X}...`, ...)

  - id: js-sql-string-concatenation
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL query built by string concatenation or interpolation. Use parameterized queries / prepared statements.
    metadata: { title: SQL injection, cwe: "CWE-89: SQL Injection", artemis-severity: high }
    patterns:
      - pattern-either:
          - pattern: $DB.query("$SQL" + $X, ...)
          - pattern: $DB.raw("$SQL" + $X, ...)
          - pattern: $DB.execute("$SQL" + $X, ...)
      - metavariable-regex:
          metavariable: $SQL
          regex: (?i)\b(select|insert|update|delete|where)\b

  - id: js-innerhtml-xss
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Assigning non-literal HTML to innerHTML/outerHTML or document.write can lead to cross-site scripting.
      Use textContent or a sanitizer such as DOMPurify.
    metadata: { title: DOM-based XSS sink, cwe: "CWE-79: Cross-site Scripting" }
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: document.write("...")

  - id: react-dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: dangerouslySetInnerHTML renders raw HTML. Sanitize the value (e.g. DOMPurify) or render text instead.
    metadata: { title: React raw HTML rendering, cwe: "CWE-79: Cross-site Scripting" }
    pattern: |
      <$EL dangerouslySetInnerHTML={...} />

  - id: angular-bypass-security-trust
    languages: [typescript]
    severity: WARNING
    message: >-
      bypassSecurityTrust* disables Angular's built-in sanitization. Make sure the value can never contain user input.
    metadata: { title: Angular sanitization bypass, cwe: "CWE-79: Cross-site Scripting" }
    pattern-either:
      - pattern: $S.bypassSecurityTrustHtml(...)
      - pattern: $S.bypassSecurityTrustScript(...)
      - pattern: $S.bypassSecurityTrustUrl(...)
      - pattern: $S.bypassSecurityTrustResourceUrl(...)

  - id: js-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled, which allows man-in-the-middle attacks.
    metadata: { title: TLS verification disabled, cwe: "CWE-295: Improper Certificate Validation", artemis-severity: high }
    pattern-either:
      - pattern: |
          { ..., rejectUnauthorized: false, ... }
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: js-hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT signed or verified with a hardcoded secret. Load it from configuration/secret storage.
    metadata: { title: Hardcoded JWT secret, cwe: "CWE-798: Use of Hard-coded Credentials", artemis-severity: high }
    pattern-either:
      - pattern: $JWT.sign($P, "...", ...)
      - pattern: $JWT.verify($T, "...", ...)

  - id: js-insecure-random-security
    languages: [javascript, typescript]
    severity: WARNING
    message: Math.random() is not cryptographically secure. Use crypto.randomBytes / crypto.getRandomValues for tokens and secrets.
    metadata: { title: Insecure randomness, cwe: "CWE-338: Weak PRNG" }
    patterns:
      - pattern: $V = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|secret|password|nonce|salt|otp|key).*

  - id: js-path-traversal-fs
    languages: [javascript, typescript]
    severity: WARNING
    message: File path built from request data. Normalize it and check it stays inside the intended directory.
    metadata: { title: Path traversal, cwe: "CWE-22: Path Traversal" }
    patterns:
      - pattern-either:
          - pattern: $FS.readFile(<... $REQ.$PARAMS.$F ...>, ...)
          - pattern: $FS.readFileSync(<... $REQ.$PARAMS.$F ...>, ...)
          - pattern: $RES.sendFile(<... $REQ.$PARAMS.$F ...>, ...)
      - metavariable-regex:
          metavariable: $PARAMS
          regex: ^(params|query|body)$
